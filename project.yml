name: CaptureTranslator
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  CaptureTranslator:
    type: application
    platform: macOS
    sources:
      - path: CaptureTranslator
        excludes:
          - Info.plist
    info:
      path: CaptureTranslator/Info.plist
    dependencies:
      - target: CaptureTranslatorFinderExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CaptureTranslator
        PRODUCT_NAME: CaptureTranslator
        CODE_SIGN_STYLE: Automatic
  CaptureTranslatorFinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: CaptureTranslatorFinderExtension
        excludes:
          - Info.plist
    info:
      path: CaptureTranslatorFinderExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CaptureTranslator.FinderExtension
        PRODUCT_NAME: CaptureTranslatorFinderExtension
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
